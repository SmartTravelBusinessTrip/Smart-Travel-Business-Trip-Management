name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smart_travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smart_travel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/smart_travel_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix src/backend

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Validate Prisma schema
        working-directory: src/backend
        run: npx prisma validate

      - name: Apply test database migrations
        run: npx prisma migrate deploy --schema src/backend/src/prisma/schema.prisma

      - name: Backend type-check
        run: npm --prefix src/backend run type-check

      - name: Frontend lint
        run: npm --prefix src/frontend run lint

      - name: Backend unit tests (provider mocked)
        env:
          GEMINI_API_KEY: ''
        run: npm --prefix src/backend run test:unit

      - name: Backend PostgreSQL integration tests
        run: npm --prefix src/backend run test:integration -- --pool=forks --poolOptions.forks.singleFork

      - name: Frontend tests
        run: npm run test:fe

      - name: Production build
        run: npm --prefix src/backend run build
